# Local development for Federation 360.
#   docker compose up --build              -> dev server with hot reload on http://localhost:5173
#   docker compose --profile preview up --build preview
#                                          -> production build on http://localhost:8080
#   docker compose --profile testapp up -d testapp
#                                          -> lab test app for the Live test page on http://localhost:5174
#                                             (lab/testapp/Start-F360TestApp.ps1 sets it up and starts it for you)
name: federation-360

services:
  dev:
    build:
      context: .
      target: dev
    # Comes back on its own whenever Docker starts (for example after a Windows restart),
    # unless you stopped it yourself with docker compose stop/down.
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Windows bind mounts do not deliver file-change events into Linux containers, so poll instead.
      F360_POLL: "1"

  preview:
    profiles: ["preview"]
    build:
      context: .
      target: serve
    ports:
      - "127.0.0.1:8080:80"

  testapp:
    profiles: ["testapp"]
    image: node:22-alpine
    working_dir: /app
    command: ["node", "lab/testapp/server.mjs"]
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      # Only the test app's folder: its code, its settings (.local, written by the start script) and its captures.
      - ./lab/testapp:/app/lab/testapp
    environment:
      F360_TESTAPP_HOST: "0.0.0.0"

volumes:
  node_modules:
